openapi: 3.0.3
info:
  title: Shelfkin API
  version: 0.1.0
  description: |
    HTTP API for Shelfkin, an app for managing a household pantry.

    This file is the API contract. The Go server interface
    (`api/internal/openapi/`) and the app's TypeScript types
    (`app/src/api/schema.ts`) are generated from it with `npm run generate`.

    ## Conventions

    - **IDs** are UUIDv7 strings: `type: string, format: uuid` (see `Id`).
    - **Timestamps** are RFC 3339 strings in UTC: `type: string, format: date-time`
      (see `Timestamp`), for example `2026-01-31T18:04:05Z`.
    - **Calendar dates** with no time of day, such as an expiry date, are
      `type: string, format: date` in `YYYY-MM-DD` form (see `Date`).
    - **JSON property names** are camelCase, for example `householdId` and `createdAt`.
    - **Errors** from every endpoint use the `Error` format:
      `{ "error": { "code": "not_found", "message": "Household not found." } }`.
      `code` is a stable, machine-readable string that clients can branch on;
      `message` is readable text and may change.
    - **Authentication**: every endpoint requires a Firebase ID token as a bearer
      token (`Authorization: Bearer <token>`) unless it sets `security: []`.
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - firebaseAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check that the API and its dependencies are up
      description: Does not require authentication.
      security: []
      responses:
        '200':
          description: The API and its dependencies are up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The database is down or did not answer within about 2 seconds (code `database_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: database_unavailable
                  message: The database is unavailable.
  /me:
    get:
      operationId: getMe
      summary: Get the signed-in user's profile
      description: |
        Returns the caller's Shelfkin user. The first authenticated request from
        a Firebase user creates it (see `User`).
      responses:
        '200':
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: patchMe
      summary: Update the signed-in user's profile
      description: |
        Updates `displayName` and/or `timezone`. Omitted fields are unchanged; an
        empty body or `{}` changes nothing and returns the current profile.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMe'
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: |
            The body is not valid JSON (code `bad_request`), `displayName` is not 1
            to 50 characters after trimming (code `invalid_display_name`), or
            `timezone` is not an IANA time zone name (code `invalid_timezone`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_timezone
                  message: timezone must be an IANA time zone name such as America/Toronto.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A Firebase ID token (a JWT) for the signed-in user, sent as `Authorization: Bearer <token>`.'
  schemas:
    Id:
      description: A UUIDv7 identifier.
      type: string
      format: uuid
      example: 0190f3a1-7c2e-7b3d-9a4f-2c1e5d6b7a80
    Timestamp:
      description: A point in time, as an RFC 3339 string in UTC.
      type: string
      format: date-time
      example: '2026-01-31T18:04:05Z'
    Date:
      description: A calendar date with no time of day, in `YYYY-MM-DD` form.
      type: string
      format: date
      example: '2026-02-14'
    Error:
      description: The error format every endpoint uses.
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          description: |
            A stable, machine-readable error code, for example `bad_request`,
            `unauthorized`, `forbidden`, `not_found`, `method_not_allowed`,
            `internal`, `database_unavailable`, `invalid_display_name` or
            `invalid_timezone`.
          type: string
          example: not_found
        message:
          description: Readable text describing the error. It may change; branch on `code` instead.
          type: string
          example: Household not found.
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    User:
      description: |
        A Shelfkin user. Created on the user's first authenticated request:
        `displayName` comes from the Firebase token's `name` claim, else the part
        of the email before `@`, else `Shelfkin user`; `timezone` starts as `UTC`.
        Later sign-ins update `email` from the token but never `displayName`.
      type: object
      required:
        - id
        - displayName
        - email
        - timezone
        - pushEnabled
      properties:
        id:
          $ref: '#/components/schemas/Id'
        displayName:
          description: Shown to other household members, for example in "Set to Low by Sam". 1 to 50 characters.
          type: string
          example: Sam
        email:
          description: The email of the Firebase account, or null if it has none.
          type: string
          nullable: true
          example: sam@example.com
        timezone:
          description: IANA time zone name, used to send expiry reminders at a sensible local time.
          type: string
          example: America/Toronto
        pushEnabled:
          description: Whether the user has opted in to push notifications.
          type: boolean
          example: false
    UpdateMe:
      description: Fields of the signed-in user to change. Omitted fields are unchanged.
      type: object
      properties:
        displayName:
          description: Trimmed, then must be 1 to 50 characters.
          type: string
          example: Sam
        timezone:
          description: An IANA time zone name such as `America/Toronto`. `Local` is not accepted.
          type: string
          example: America/Toronto
  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: bad_request
              message: The request body is not valid JSON.
    Unauthorized:
      description: The bearer token is missing, invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: A valid Firebase ID token is required.
    Forbidden:
      description: The caller is authenticated but not allowed to do this.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: You are not a member of this household.
    NotFound:
      description: The resource does not exist, or the caller cannot see it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Household not found.
    InternalError:
      description: An unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal
              message: Something went wrong.
