openapi: 3.0.3
info:
  title: Shelfkin API
  version: 0.1.0
  description: |
    HTTP API for Shelfkin, an app for managing a household pantry.

    This file is the API contract. The Go server interface
    (`api/internal/openapi/`) and the app's TypeScript types
    (`app/src/api/schema.ts`) are generated from it with `npm run generate`.

    ## Conventions

    - **IDs** are UUIDv7 strings: `type: string, format: uuid` (see `Id`).
    - **Timestamps** are RFC 3339 strings in UTC: `type: string, format: date-time`
      (see `Timestamp`), for example `2026-01-31T18:04:05Z`.
    - **Calendar dates** with no time of day, such as an expiry date, are
      `type: string, format: date` in `YYYY-MM-DD` form (see `Date`).
    - **JSON property names** are camelCase, for example `householdId` and `createdAt`.
    - **Errors** from every endpoint use the `Error` format:
      `{ "error": { "code": "not_found", "message": "Household not found." } }`.
      `code` is a stable, machine-readable string that clients can branch on;
      `message` is readable text and may change.
    - **Authentication**: every endpoint requires a Firebase ID token as a bearer
      token (`Authorization: Bearer <token>`) unless it sets `security: []`.
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - firebaseAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check that the API and its dependencies are up
      description: Does not require authentication.
      security: []
      responses:
        '200':
          description: The API and its dependencies are up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The database is down or did not answer within about 2 seconds (code `database_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: database_unavailable
                  message: The database is unavailable.
  /me:
    get:
      operationId: getMe
      summary: Get the signed-in user's profile
      description: |
        Returns the caller's Shelfkin user. The first authenticated request from
        a Firebase user creates it (see `User`).
      responses:
        '200':
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: patchMe
      summary: Update the signed-in user's profile
      description: |
        Updates `displayName`, `timezone` and/or `pushEnabled`. Omitted fields are
        unchanged; an empty body or `{}` changes nothing and returns the current
        profile.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMe'
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: |
            The body is not valid JSON (code `bad_request`), `displayName` is not 1
            to 50 characters after trimming (code `invalid_display_name`), or
            `timezone` is not an IANA time zone name (code `invalid_timezone`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_timezone
                  message: timezone must be an IANA time zone name such as America/Toronto.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/push-tokens:
    post:
      operationId: registerPushToken
      summary: Register or refresh this device's Expo push token
      description: |
        Registers `token` for the caller. The app calls this on every start:

        - A token the caller already has is refreshed: its `lastSeenAt` (and
          `platform`, if it changed) is updated and no new token is added.
        - A token that belongs to another user moves to the caller, for example
          when two people sign in on one device in turn.

        A user can have several tokens, one per device. Pushes are only sent
        when the user's `pushEnabled` is on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPushToken'
      responses:
        '200':
          description: The registered token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushToken'
        '400':
          description: |
            The body is missing or not valid JSON (code `bad_request`), `token` is
            not an Expo push token of at most 255 characters (code
            `invalid_token`), or `platform` is not `ios`, `android` or `web`
            (code `invalid_platform`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_token
                  message: token must be an Expo push token such as ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx].
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/push-tokens/{token}:
    delete:
      operationId: deletePushToken
      summary: Remove this device's Expo push token
      description: |
        Deletes the caller's `token`, for example on sign-out, so the device
        gets no more pushes. A token that does not exist or belongs to another
        user is left alone and still returns 204, so callers cannot remove or
        detect another user's device.
      parameters:
        - name: token
          in: path
          required: true
          description: The Expo push token, URL-encoded (it contains `[` and `]`).
          schema:
            type: string
          example: ExponentPushToken%5Bxxxxxxxxxxxxxxxxxxxxxx%5D
      responses:
        '204':
          description: The caller no longer has this token.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /households:
    get:
      operationId: listHouseholds
      summary: List the households the signed-in user belongs to
      description: |
        Every household the caller is a member of, with the caller's role in it,
        sorted by name (case-insensitive). A user with no households gets an
        empty list.
      responses:
        '200':
          description: The caller's households.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createHousehold
      summary: Create a household
      description: Creates a household with the caller as its owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHousehold'
      responses:
        '201':
          description: The new household. The caller's `role` is `owner`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '400':
          $ref: '#/components/responses/InvalidHouseholdName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /households/{householdId}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: getHousehold
      summary: Get one of the signed-in user's households
      responses:
        '200':
          description: The household, with the caller's role in it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HouseholdNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateHousehold
      summary: Rename a household
      description: Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHousehold'
      responses:
        '200':
          description: The renamed household.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '400':
          $ref: '#/components/responses/InvalidHouseholdName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OwnerOnly'
        '404':
          $ref: '#/components/responses/HouseholdNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteHousehold
      summary: Delete a household
      description: |
        Owner only. Deletes the household together with its members, invites,
        custom catalog items, item defaults, pantry entries and item events.
      responses:
        '204':
          description: The household was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OwnerOnly'
        '404':
          $ref: '#/components/responses/HouseholdNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /households/{householdId}/entries:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    post:
      operationId: createEntry
      summary: Add a pantry entry
      description: |
        Adds one entry (one purchase) to the household's pantry and records an
        `entry_created` event in the same transaction.

        The client generates `id` and `eventId`, so a retried request is
        applied once: repeating it with the same `id` and `eventId` returns
        200 with the existing entry and writes nothing.

        Defaults for omitted fields:
        - `locationId`: the item's default location for this household.
        - `level`: `full`.
        - `purchasedOn`: today in the caller's `timezone` (see `User`).
        - `expiresOn`: `purchasedOn` plus the item's shelf life, or no expiry
          if the item has none. Send `null` for no expiry.

        An expiry date before the purchase date, and a purchase date in the
        future, are accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntry'
      responses:
        '200':
          description: A retry of a create that was already applied. The entry as it is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryEntry'
        '201':
          description: The new entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryEntry'
        '400':
          description: |
            The body is not valid JSON or a value has the wrong type (code
            `bad_request`), `id` or `eventId` is missing or not a UUIDv7 (code
            `invalid_id`), `catalogItemId` is not a built-in item or a custom
            item of this household (code `invalid_catalog_item`), `locationId`
            is not a location (code `invalid_location`), or `level` is not a
            stock level (code `invalid_level`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_catalog_item
                  message: catalogItemId must be a built-in item or one of this household's items.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HouseholdNotFound'
        '409':
          $ref: '#/components/responses/EntryConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /households/{householdId}/entries/{entryId}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - $ref: '#/components/parameters/EntryId'
    patch:
      operationId: updateEntry
      summary: Change one field of a pantry entry
      description: |
        Changes exactly one of `level`, `locationId`, `purchasedOn` or
        `expiresOn`, and records one `level_changed`, `location_changed`,
        `purchase_date_changed` or `expiry_changed` event in the same
        transaction. `expiresOn: null` clears the expiry. Changing
        `purchasedOn` does not change `expiresOn`.

        Setting a field to the value it already has changes nothing and
        records no event. Repeating a request with the same `eventId` returns
        the entry as it is now and does not apply the change again. When two
        members change the same entry at the same time, both changes are
        applied in turn (the last one wins) and both are recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEntry'
      responses:
        '200':
          description: The entry after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryEntry'
        '400':
          description: |
            The body is not valid JSON or a value has the wrong type (code
            `bad_request`), `eventId` is missing or not a UUIDv7 (code
            `invalid_id`), the body does not set exactly one field (code
            `one_field_per_update`), `locationId` is not a location (code
            `invalid_location`), or `level` is not a stock level (code
            `invalid_level`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: one_field_per_update
                  message: Set exactly one of level, locationId, purchasedOn or expiresOn.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/EntryNotFound'
        '409':
          $ref: '#/components/responses/EntryConflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteEntry
      summary: Remove a pantry entry
      description: |
        Deletes the entry and records an `entry_deleted` event in the same
        transaction. Repeating the request with the same `eventId` after it
        succeeded returns 204 again.
      parameters:
        - name: eventId
          in: query
          required: true
          description: The client-generated UUIDv7 of the `entry_deleted` event.
          schema:
            type: string
            example: 0190f3a1-7c2e-7b3d-9a4f-2c1e5d6b7a82
      responses:
        '204':
          description: The entry was deleted (or this delete was already applied).
        '400':
          description: |
            `eventId` is missing or `entryId` is not a UUID (code
            `bad_request`), or `eventId` is not a UUIDv7 (code `invalid_id`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_id
                  message: eventId must be a UUIDv7.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/EntryNotFound'
        '409':
          $ref: '#/components/responses/EntryConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /households/{householdId}/members:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listMembers
      summary: List a household's members
      description: |
        Every member of the household, owner first, then the other members by
        the time they joined (earliest first). Any member can call this.
      responses:
        '200':
          description: The household's members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HouseholdNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /households/{householdId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: userId
        in: path
        required: true
        description: The member's user ID. A value that is not a UUID gets 400 (code `bad_request`).
        schema:
          $ref: '#/components/schemas/Id'
    delete:
      operationId: removeMember
      summary: Remove a member, or leave the household
      description: |
        - The **owner** can remove any other member.
        - A **member** can remove only themselves, which is leaving the household.
        - The **owner** cannot leave: they must transfer ownership to another
          member (`POST /households/{householdId}/transfer-ownership`) or
          delete the household first.

        The removed user loses access to the household straight away. Pantry
        entries and events they created stay, still labelled with their name.
      responses:
        '204':
          description: The user is no longer a member of the household.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OwnerOnly'
        '404':
          description: |
            The household does not exist or the caller is not a member of it, or
            `userId` is not a member of the household (code `not_found` in
            every case).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: not_found
                  message: Member not found.
        '409':
          description: |
            The owner tried to remove themselves (code `owner_cannot_leave`), or
            the membership changed while the request ran (code `conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: owner_cannot_leave
                  message: The owner cannot leave the household. Transfer ownership to another member or delete the household first.
        '500':
          $ref: '#/components/responses/InternalError'
  /households/{householdId}/transfer-ownership:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    post:
      operationId: transferOwnership
      summary: Make another member the owner
      description: |
        Owner only. Makes `userId`, who must already be a member, the owner and
        the caller a member, in one step. The household always has exactly one
        owner. Afterwards the caller can leave the household.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnership'
      responses:
        '200':
          description: The household's members after the transfer, new owner first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
        '400':
          description: |
            The body is missing or not valid JSON (code `bad_request`), `userId`
            is not a member of the household (code `not_a_member`), or `userId`
            is the caller (code `already_owner`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: not_a_member
                  message: The new owner must be a member of the household.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OwnerOnly'
        '404':
          $ref: '#/components/responses/HouseholdNotFound'
        '409':
          description: |
            Another change to the household's members conflicted with this one;
            reload the members and try again (code `conflict`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: conflict
                  message: The household's members changed while this request ran. Try again.
        '500':
          $ref: '#/components/responses/InternalError'
  /households/{householdId}/catalog/search:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: searchCatalog
      summary: Type-ahead search of the household's catalog
      description: |
        The best-matching built-in catalog items plus this household's own custom
        items, for type-ahead as the user types an ingredient name. Custom items
        of other households never appear. `categoryId` and `locationId` are the
        household's **effective** defaults: its own override of a built-in item
        if it set one, else the item's default.

        Matching is case-insensitive, and `%`, `_` and `\` in `q` match literally.
        Results are ranked, best first:

        1. Exact name (`milk` finds `Milk`)
        2. Names that start with `q` (`mil`: `Milk` before `Oat milk`)
        3. Names with a word that starts with `q` (`flour` finds `All-purpose flour`)
        4. Fuzzy matches by trigram word similarity (`tomatos` finds `Tomatoes`),
           most similar first. Only for a `q` of 3 or more characters.

        Ties go to the shorter name, then alphabetically.
      parameters:
        - name: q
          in: query
          required: false
          description: |
            The text typed so far. Trimmed; an empty or whitespace-only (or
            missing) `q` returns an empty list. At most 100 characters after
            trimming, else 400 (code `invalid_query`).
          schema:
            type: string
          example: tom
        - name: limit
          in: query
          required: false
          description: The most items to return, 1 to 25 (default 10), else 400 (code `invalid_limit`).
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 10
      responses:
        '200':
          description: The matching items, best first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemList'
        '400':
          description: |
            `householdId` is not a UUID or `limit` is not an integer (code
            `bad_request`), `q` is longer than 100 characters after trimming
            (code `invalid_query`), or `limit` is outside 1 to 25 (code
            `invalid_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_query
                  message: q must be at most 100 characters after trimming spaces.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/HouseholdNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /categories:
    get:
      operationId: listCategories
      summary: List the item categories
      description: Every built-in category, in display order. Needs a signed-in user but no household.
      responses:
        '200':
          description: The categories, in display order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /locations:
    get:
      operationId: listLocations
      summary: List the storage locations
      description: Every built-in storage location, in display order. Needs a signed-in user but no household.
      responses:
        '200':
          description: The locations, in display order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /households/{householdId}/invites:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      operationId: listInvites
      summary: List a household's active invites
      description: |
        Owner only. The household's invites that are neither revoked nor
        expired, newest first. A household with none returns an empty list.
      responses:
        '200':
          description: The household's active invites, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OwnerOnly'
        '404':
          $ref: '#/components/responses/HouseholdNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createInvite
      summary: Create an invite code
      description: |
        Owner only. Creates a new invite code for the household, valid for 7
        days. Anyone signed in can use it, any number of times, to join the
        household as a member until it expires or is revoked. A household can
        have several active invites; creating one does not revoke the others.
        No request body.
      responses:
        '201':
          description: The new invite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OwnerOnly'
        '404':
          $ref: '#/components/responses/HouseholdNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /households/{householdId}/invites/{inviteId}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: inviteId
        in: path
        required: true
        description: The invite's ID. A value that is not a UUID gets 400 (code `bad_request`).
        schema:
          $ref: '#/components/schemas/Id'
    delete:
      operationId: revokeInvite
      summary: Revoke an invite code
      description: |
        Owner only. The code stops working straight away; members who already
        joined with it stay. Revoking an invite that is already revoked, or
        has expired, also succeeds.
      responses:
        '204':
          description: The invite is revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OwnerOnly'
        '404':
          description: |
            The household does not exist or the caller is not a member of it,
            or `inviteId` is not an invite of this household (code `not_found`
            in every case).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: not_found
                  message: Invite not found.
        '500':
          $ref: '#/components/responses/InternalError'
  /invites/join:
    post:
      operationId: joinInvite
      summary: Join a household with an invite code
      description: |
        Adds the caller to the invite's household as a member. The code is
        normalised first: whitespace and dashes are removed and letters are
        upper-cased, so `abcd-efgh` matches `ABCDEFGH`.

        A caller who is already a member of the household (including its
        owner) gets 200 with `alreadyMember: true` and their current role,
        even if the code has expired or been revoked. Error responses never
        say anything about the household.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinInviteRequest'
      responses:
        '200':
          description: The caller is a member of the household.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinInviteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No invite has this code (code `invite_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invite_not_found
                  message: This invite code is not valid.
        '410':
          description: |
            The invite was revoked (code `invite_revoked`) or has expired (code
            `invite_expired`). A code that is both gets `invite_revoked`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invite_expired
                  message: This invite code has expired.
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    HouseholdId:
      name: householdId
      in: path
      required: true
      description: The household's ID. A value that is not a UUID gets 400 (code `bad_request`).
      schema:
        $ref: '#/components/schemas/Id'
    EntryId:
      name: entryId
      in: path
      required: true
      description: The pantry entry's ID. A value that is not a UUID gets 400 (code `bad_request`).
      schema:
        $ref: '#/components/schemas/Id'
  securitySchemes:
    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'A Firebase ID token (a JWT) for the signed-in user, sent as `Authorization: Bearer <token>`.'
  schemas:
    Id:
      description: A UUIDv7 identifier.
      type: string
      format: uuid
      example: 0190f3a1-7c2e-7b3d-9a4f-2c1e5d6b7a80
    Timestamp:
      description: A point in time, as an RFC 3339 string in UTC.
      type: string
      format: date-time
      example: '2026-01-31T18:04:05Z'
    Date:
      description: A calendar date with no time of day, in `YYYY-MM-DD` form.
      type: string
      format: date
      example: '2026-02-14'
    Error:
      description: The error format every endpoint uses.
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          description: |
            A stable, machine-readable error code, for example `bad_request`,
            `unauthorized`, `forbidden`, `not_found`, `method_not_allowed`,
            `internal`, `database_unavailable`, `invalid_display_name`,
            `invalid_timezone`, `invalid_name` or `owner_only`.
          type: string
          example: not_found
        message:
          description: Readable text describing the error. It may change; branch on `code` instead.
          type: string
          example: Household not found.
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    User:
      description: |
        A Shelfkin user. Created on the user's first authenticated request:
        `displayName` comes from the Firebase token's `name` claim, else the part
        of the email before `@`, else `Shelfkin user`; `timezone` starts as `UTC`.
        Later sign-ins update `email` from the token but never `displayName`.
      type: object
      required:
        - id
        - displayName
        - email
        - timezone
        - pushEnabled
      properties:
        id:
          $ref: '#/components/schemas/Id'
        displayName:
          description: Shown to other household members, for example in "Set to Low by Sam". 1 to 50 characters.
          type: string
          example: Sam
        email:
          description: The email of the Firebase account, or null if it has none.
          type: string
          nullable: true
          example: sam@example.com
        timezone:
          description: IANA time zone name, used to send expiry reminders at a sensible local time.
          type: string
          example: America/Toronto
        pushEnabled:
          description: |
            Whether the user has opted in to expiry push notifications. Starts as
            `false`. The setting is per user and covers all of their devices;
            turning it off keeps their push tokens, so turning it back on needs no
            re-registration.
          type: boolean
          example: false
    UpdateMe:
      description: Fields of the signed-in user to change. Omitted fields are unchanged.
      type: object
      properties:
        displayName:
          description: Trimmed, then must be 1 to 50 characters.
          type: string
          example: Sam
        timezone:
          description: An IANA time zone name such as `America/Toronto`. `Local` is not accepted.
          type: string
          example: America/Toronto
        pushEnabled:
          description: Turns expiry push notifications on or off for all of the user's devices.
          type: boolean
          example: true
    PushPlatform:
      description: The platform of the device a push token belongs to.
      type: string
      enum:
        - ios
        - android
        - web
    RegisterPushToken:
      description: A device's Expo push token to register for the signed-in user.
      type: object
      required:
        - token
        - platform
      properties:
        token:
          description: |
            An Expo push token, `ExponentPushToken[...]` or `ExpoPushToken[...]`,
            at most 255 characters.
          type: string
          maxLength: 255
          example: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
        platform:
          $ref: '#/components/schemas/PushPlatform'
    PushToken:
      description: A push token registered for the signed-in user.
      type: object
      required:
        - token
        - platform
        - lastSeenAt
      properties:
        token:
          type: string
          example: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
        platform:
          $ref: '#/components/schemas/PushPlatform'
        lastSeenAt:
          # When the token was last registered or refreshed.
          $ref: '#/components/schemas/Timestamp'
    Household:
      description: A household, as seen by the signed-in user.
      type: object
      required:
        - id
        - name
        - role
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          description: 1 to 50 characters. Not unique.
          type: string
          example: Home
        role:
          $ref: '#/components/schemas/MemberRole'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    MemberRole:
      description: A member's role in a household. Each household has exactly one owner.
      type: string
      enum:
        - owner
        - member
    HouseholdList:
      type: object
      required:
        - households
      properties:
        households:
          type: array
          items:
            $ref: '#/components/schemas/Household'
    CreateHousehold:
      type: object
      required:
        - name
      properties:
        name:
          description: Trimmed, then must be 1 to 50 characters.
          type: string
          example: Home
    UpdateHousehold:
      type: object
      required:
        - name
      properties:
        name:
          description: Trimmed, then must be 1 to 50 characters.
          type: string
          example: Cottage
    StockLevel:
      description: How much of an entry is left. `out` entries stay in the pantry until deleted.
      type: string
      enum:
        - full
        - half
        - low
        - out
    PantryEntry:
      description: One purchase of a catalog item in a household's pantry, for example "Milk (Oct 20)".
      type: object
      required:
        - id
        - catalogItemId
        - locationId
        - level
        - purchasedOn
        - expiresOn
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        catalogItemId:
          $ref: '#/components/schemas/Id'
        locationId:
          description: The ID of the location the entry is stored in.
          type: integer
          example: 2
        level:
          $ref: '#/components/schemas/StockLevel'
        purchasedOn:
          $ref: '#/components/schemas/Date'
        expiresOn:
          description: The expiry date, or null if the entry has none.
          type: string
          format: date
          nullable: true
          example: '2026-02-14'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          description: |
            When the entry last changed. A change that sets a field to the
            value it already has does not count.
          type: string
          format: date-time
          example: '2026-01-31T18:04:05Z'
    CreateEntry:
      type: object
      required:
        - id
        - eventId
        - catalogItemId
      properties:
        id:
          description: |
            The new entry's ID, a UUIDv7 generated by the client. It is a plain
            string so that any value that is not a UUIDv7 gets code `invalid_id`.
          type: string
          example: 0190f3a1-7c2e-7b3d-9a4f-2c1e5d6b7a80
        eventId:
          description: The ID of the `entry_created` event, a UUIDv7 generated by the client.
          type: string
          example: 0190f3a1-7c2e-7b3d-9a4f-2c1e5d6b7a81
        catalogItemId:
          $ref: '#/components/schemas/Id'
        locationId:
          description: Defaults to the item's default location for this household.
          type: integer
          example: 2
        level:
          $ref: '#/components/schemas/StockLevel'
        purchasedOn:
          $ref: '#/components/schemas/Date'
        expiresOn:
          description: |
            Omitted: `purchasedOn` plus the item's shelf life, or no expiry if
            the item has none. `null`: no expiry.
          type: string
          format: date
          nullable: true
          example: '2026-02-14'
          x-go-type: nullable.Nullable[openapi_types.Date]
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
          x-go-type-skip-optional-pointer: true
    UpdateEntry:
      description: '`eventId` and exactly one of the other fields.'
      type: object
      required:
        - eventId
      properties:
        eventId:
          description: The ID of the change event, a UUIDv7 generated by the client.
          type: string
          example: 0190f3a1-7c2e-7b3d-9a4f-2c1e5d6b7a81
        level:
          $ref: '#/components/schemas/StockLevel'
        locationId:
          type: integer
          example: 3
        purchasedOn:
          $ref: '#/components/schemas/Date'
        expiresOn:
          description: The new expiry date, or `null` to clear it.
          type: string
          format: date
          nullable: true
          example: '2026-02-14'
          x-go-type: nullable.Nullable[openapi_types.Date]
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
          x-go-type-skip-optional-pointer: true
    Member:
      description: A member of a household.
      type: object
      required:
        - userId
        - displayName
        - email
        - role
        - joinedAt
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        displayName:
          description: The member's display name (see `User`).
          type: string
          example: Sam
        email:
          description: The member's email, or null if their account has none.
          type: string
          nullable: true
          example: sam@example.com
        role:
          $ref: '#/components/schemas/MemberRole'
        joinedAt:
          # When the user joined (or created) the household.
          $ref: '#/components/schemas/Timestamp'
    MemberList:
      type: object
      required:
        - members
      properties:
        members:
          description: The owner first, then the other members by `joinedAt`.
          type: array
          items:
            $ref: '#/components/schemas/Member'
    TransferOwnership:
      type: object
      required:
        - userId
      properties:
        userId:
          # The member to make the owner.
          $ref: '#/components/schemas/Id'
    Category:
      description: A built-in item category.
      type: object
      required:
        - id
        - key
        - name
      properties:
        id:
          description: The same in every environment.
          type: integer
          example: 2
        key:
          description: A stable identifier that never changes, for example `dairy`.
          type: string
          example: dairy
        name:
          description: Display name.
          type: string
          example: Dairy
    CategoryList:
      type: object
      required:
        - items
      properties:
        items:
          description: Every category, in display order.
          type: array
          items:
            $ref: '#/components/schemas/Category'
    Location:
      description: A built-in storage location.
      type: object
      required:
        - id
        - key
        - name
      properties:
        id:
          description: The same in every environment.
          type: integer
          example: 2
        key:
          description: A stable identifier that never changes, for example `fridge`.
          type: string
          example: fridge
        name:
          description: Display name.
          type: string
          example: Fridge
    LocationList:
      type: object
      required:
        - items
      properties:
        items:
          description: Every location, in display order.
          type: array
          items:
            $ref: '#/components/schemas/Location'
    CatalogItem:
      description: |
        A catalog item as seen by one household: a built-in item or one of the
        household's own custom items, with the household's effective defaults.
      type: object
      required:
        - id
        - name
        - isCustom
        - categoryId
        - locationId
        - shelfLifeDays
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          example: Milk
        isCustom:
          description: True for the household's own custom item, false for a built-in item.
          type: boolean
          example: false
        categoryId:
          type: integer
          example: 2
          description: The household's default category for this item (its override, else the item's default).
        locationId:
          type: integer
          example: 2
          description: The household's default location for this item (its override, else the item's default).
        shelfLifeDays:
          description: Typical shelf life in days, used to suggest an expiry date. Null means no suggestion.
          type: integer
          nullable: true
          example: 7
    CatalogItemList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
    Invite:
      description: An invite code for a household, as seen by its owner.
      type: object
      required:
        - id
        - code
        - url
        - expiresAt
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          description: |
            8 characters from `ABCDEFGHJKMNPQRSTUVWXYZ23456789` (no `I`, `L`,
            `O`, `0` or `1`). Apps may show it as `ABCD-EFGH`.
          type: string
          example: K7MQ3XPA
        url:
          description: The invite link, `<APP_BASE_URL>/join/<code>`.
          type: string
          format: uri
          example: https://shelfkin.web.app/join/K7MQ3XPA
        expiresAt:
          # Exactly 7 days after createdAt.
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    InviteList:
      type: object
      required:
        - invites
      properties:
        invites:
          description: Active invites, newest first.
          type: array
          items:
            $ref: '#/components/schemas/Invite'
    JoinInviteRequest:
      type: object
      required:
        - code
      properties:
        code:
          description: |
            The invite code. Whitespace and dashes are ignored and letters may
            be lower-case.
          type: string
          example: k7mq-3xpa
    JoinInviteResult:
      type: object
      required:
        - household
        - alreadyMember
      properties:
        household:
          $ref: '#/components/schemas/Household'
        alreadyMember:
          description: True if the caller was already a member, so nothing changed.
          type: boolean
          example: false
  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: bad_request
              message: The request body is not valid JSON.
    Unauthorized:
      description: The bearer token is missing, invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthorized
              message: A valid Firebase ID token is required.
    Forbidden:
      description: The caller is authenticated but not allowed to do this.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: You are not a member of this household.
    NotFound:
      description: The resource does not exist, or the caller cannot see it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Household not found.
    InternalError:
      description: An unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: internal
              message: Something went wrong.
    InvalidHouseholdName:
      description: |
        The body is not valid JSON (code `bad_request`), or `name` is not 1 to 50
        characters after trimming (code `invalid_name`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_name
              message: name must be 1 to 50 characters after trimming spaces.
    OwnerOnly:
      description: Only the household's owner can do this (code `owner_only`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: owner_only
              message: Only the household owner can do this.
    HouseholdNotFound:
      description: |
        The household does not exist or the caller is not a member of it
        (code `not_found`); the two cases are indistinguishable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Household not found.
    EntryNotFound:
      description: |
        The household does not exist, the caller is not a member of it, or the
        entry is not in that household (code `not_found`); the cases are
        indistinguishable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: Entry not found.
    EntryConflict:
      description: |
        `eventId` was already used for a different change (code
        `event_id_conflict`), or the entry `id` is already used by an entry
        for a different catalog item or household (code `entry_id_conflict`).
        Generate new IDs for a new change.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: event_id_conflict
              message: eventId was already used for a different change.
