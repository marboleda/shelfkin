name: CI

# No path filters on purpose: every push and PR runs every job, so a check
# can never be silently skipped.
on:
  push:
  pull_request:
    branches: [main]

# One run per branch or PR. A newer push cancels the run still in progress.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    # Database tests use api/db/dbtest, which creates one database per test
    # on this server. Keep the tag in sync with compose.yaml.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: shelfkin
          POSTGRES_PASSWORD: shelfkin
          POSTGRES_DB: shelfkin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shelfkin -d shelfkin"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://shelfkin:shelfkin@localhost:5432/shelfkin?sslmode=disable
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache: true
          # Keys the module and build cache on go.mod and, once it exists,
          # go.sum. Pointing at go.sum alone fails while the module has no
          # dependencies.
          cache-dependency-path: api/go.*

      - name: Go version
        run: go version

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  app:
    name: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      # Regenerates from openapi/openapi.yaml and fails if the committed
      # generated code differs. Needs app/node_modules (above) and Go, which
      # the runner has; go.mod's go line makes it fetch the pinned toolchain.
      - name: Generated code is up to date
        working-directory: .
        run: npm run check:generated

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

  # Static checks only: no backend, no credentials, nothing is created.
  infra:
    name: infra
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Init
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate

      # Every provider is mocked, so this also needs no credentials.
      - name: Test
        run: terraform test
