name: CI

# No path filters on purpose: every push and PR runs both jobs, so a check
# can never be silently skipped.
on:
  push:
  pull_request:
    branches: [main]

# One run per branch or PR. A newer push cancels the run still in progress.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    # Services (e.g. Postgres) and their env vars can be added here.
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache: true
          # Keys the module and build cache on go.mod and, once it exists,
          # go.sum. Pointing at go.sum alone fails while the module has no
          # dependencies.
          cache-dependency-path: api/go.*

      - name: Go version
        run: go version

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  app:
    name: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci
